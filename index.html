  <script>
    // Decide before first paint whether the opening sequence plays, so the page never shows ahead of it.
    // It plays once per browser session and not at all when reduced motion is requested. ?intro replays it.
    (function () {
      try {
        if (!/[?&]intro(=|&|$)/.test(location.search)) {
          if (matchMedia('(prefers-reduced-motion: reduce)').matches || sessionStorage.getItem('playtp-intro-seen')) return;
        }
        sessionStorage.setItem('playtp-intro-seen', '1');
      } catch (error) { /* Storage is blocked: play it anyway. */ }
      document.documentElement.classList.add('intro-on');
      // If the sequence never starts or stalls, the page still appears.
      setTimeout(function () { document.documentElement.classList.remove('intro-on'); }, 9000);
    })();
  </script>
